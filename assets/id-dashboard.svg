<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Card -->
    <linearGradient id="dash-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B24" />
      <stop offset="50%" stop-color="#0E141D" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>

    <!-- Cyan to Teal Accent -->
    <linearGradient id="dash-cyan-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00FFC6" />
    </linearGradient>

    <!-- Metallic Lanyard Clasp Gradient -->
    <linearGradient id="dash-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="65%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Holographic Light Sweep -->
    <linearGradient id="dash-foil-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="45%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FFC6" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="dash-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>

    <style>
      .dash-font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      }
      .dash-font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Pendulum Swing with Entrance Drop */
      @keyframes dash-lanyard-swing {
        0% { transform: translateY(-40px) rotate(-4deg); opacity: 0; }
        15% { transform: translateY(0px) rotate(3deg); opacity: 1; }
        30% { transform: translateY(0px) rotate(-2deg); }
        45% { transform: translateY(0px) rotate(1.4deg); }
        60% { transform: translateY(0px) rotate(-1.4deg); }
        75% { transform: translateY(0px) rotate(1.4deg); }
        90% { transform: translateY(0px) rotate(-1.4deg); }
        100% { transform: translateY(0px) rotate(1.4deg); }
      }

      /* Foil Sweep Animation */
      @keyframes dash-foil-anim {
        0% { transform: translateX(-300px); }
        40%, 100% { transform: translateX(650px); }
      }

      @keyframes dash-chip-glow {
        0%, 100% { filter: drop-shadow(0 0 3px #00E5FF); }
        50% { filter: drop-shadow(0 0 8px #00FFC6); }
      }

      .dash-lanyard-assembly {
        transform-origin: 450px 0px;
        animation: dash-lanyard-swing 8s ease-in-out infinite alternate;
      }

      .dash-foil {
        animation: dash-foil-anim 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .dash-chip {
        animation: dash-chip-glow 3s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .dash-lanyard-assembly, .dash-foil, .dash-chip {
          animation: none !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Lanyard Strap Hanging from Top Center -->
  <g transform="translate(435, 0)">
    <rect width="30" height="42" fill="#0E141D" stroke="#18212B" stroke-width="1" />
    <line x1="8" y1="0" x2="8" y2="42" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3 3" />
    <line x1="22" y1="0" x2="22" y2="42" stroke="#00FFC6" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3 3" />
  </g>

  <!-- Entire Suspended Lanyard & Badge Assembly -->
  <g class="dash-lanyard-assembly">
    <!-- Metal Clip & Buckle Attachment -->
    <g transform="translate(425, 36)">
      <!-- Ring Loop -->
      <path d="M 12 0 L 38 0 L 32 16 L 18 16 Z" fill="url(#dash-metal)" stroke="#18212B" stroke-width="1" />
      <circle cx="25" cy="8" r="4" fill="#080B10" />
      <!-- Swivel Clasp Body -->
      <rect x="18" y="15" width="14" height="20" rx="3" fill="url(#dash-metal)" stroke="#334155" stroke-width="0.8" />
      <circle cx="25" cy="25" r="2.5" fill="#18212B" />
      <!-- Card Punch Slot Hole -->
      <rect x="10" y="30" width="30" height="6" rx="3" fill="#080B10" stroke="#00E5FF" stroke-width="0.8" stroke-opacity="0.4" />
    </g>

    <!-- Main Hanging ID Card Body (Width: 620, Height: 330) Centered at X: 140 -->
    <g transform="translate(140, 68)">
      <!-- Outer Card Shield / Border with Glow -->
      <rect width="620" height="330" rx="14" fill="url(#dash-card-bg)" stroke="#18212B" stroke-width="2" />
      <rect width="620" height="330" rx="14" fill="url(#dash-grid)" />
      
      <!-- Cyan Neon Perimeter Trim -->
      <rect x="5" y="5" width="610" height="320" rx="10" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 6" />

      <!-- Foil Light Sweep Layer (Masked to Card) -->
      <g clip-path="url(#dash-card-clip)">
        <clipPath id="dash-card-clip">
          <rect width="620" height="330" rx="14" />
        </clipPath>
        <rect x="-200" y="0" width="250" height="330" fill="url(#dash-foil-sweep)" transform="skewX(-25)" class="dash-foil" />
      </g>

      <!-- Top Header Strip: Security Clearance / Issuer -->
      <g transform="translate(25, 20)">
        <rect width="570" height="32" rx="6" fill="#111720" stroke="#18212B" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#00FFC6" />
        <text x="28" y="20" class="dash-font-mono" font-size="10.5" font-weight="700" fill="#00E5FF" letter-spacing="1">
          CREDENTIAL MATRIX // RANIT DAS
        </text>
        <text x="555" y="20" class="dash-font-mono" font-size="10" fill="#9AA8B7" text-anchor="end">
          SECURITY LEVEL // 01 VERIFIED
        </text>
      </g>

      <!-- Center-Left: Smart Microchip / Cryptographic Hash Schematic (NO second face!) -->
      <g transform="translate(35, 75)">
        <!-- Silicon Microchip Container -->
        <rect width="140" height="150" rx="8" fill="#0E141D" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.5" />
        
        <!-- Golden / Cyan Microchip Circuit Traces -->
        <g stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.6">
          <path d="M 20 0 L 20 20 L 40 20" />
          <path d="M 120 0 L 120 20 L 100 20" />
          <path d="M 0 50 L 25 50" />
          <path d="M 0 80 L 25 80" />
          <path d="M 0 110 L 25 110" />
          <path d="M 140 50 L 115 50" />
          <path d="M 140 80 L 115 80" />
          <path d="M 140 110 L 115 110" />
          <path d="M 40 150 L 40 130 L 55 130" />
          <path d="M 100 150 L 100 130 L 85 130" />
        </g>

        <!-- Center Silicon Die -->
        <rect x="35" y="40" width="70" height="70" rx="4" fill="#141B24" stroke="#00FFC6" stroke-width="1.5" class="dash-chip" />
        <circle cx="70" cy="75" r="16" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3 3" />
        <circle cx="70" cy="75" r="6" fill="#00FFC6" />
        <text x="70" y="125" class="dash-font-mono" font-size="8.5" fill="#00FFC6" text-anchor="middle" font-weight="700">CYBER//CHIP</text>
        <text x="70" y="138" class="dash-font-mono" font-size="7" fill="#9AA8B7" text-anchor="middle">SHA-256 ENCRYPTED</text>
      </g>

      <!-- Center-Right: Verified Identification Details -->
      <g transform="translate(200, 75)">
        <text x="0" y="20" class="dash-font-mono" font-size="11" fill="#9AA8B7">SUBJECT IDENTIFIER:</text>
        <text x="0" y="46" class="dash-font-sans" font-size="24" font-weight="800" fill="#F3F7FA" letter-spacing="0.5">
          RANIT DAS
        </text>

        <!-- Accent Underline -->
        <rect x="0" y="56" width="390" height="2" fill="url(#dash-cyan-teal)" />

        <g transform="translate(0, 78)" class="dash-font-mono" font-size="11">
          <text x="0" y="0" fill="#00E5FF" font-weight="600">ROLE:</text>
          <text x="120" y="0" fill="#F3F7FA">Web Developer &amp; UI/UX Design</text>

          <text x="0" y="24" fill="#00E5FF" font-weight="600">DOMAINS:</text>
          <text x="120" y="24" fill="#00FFC6">Local-First Web, Security, IoT</text>

          <text x="0" y="48" fill="#00E5FF" font-weight="600">EDUCATION:</text>
          <text x="120" y="48" fill="#F3F7FA">B.Tech ECE (RCC IIT, MAKAUT)</text>

          <text x="0" y="72" fill="#00E5FF" font-weight="600">METHODOLOGY:</text>
          <text x="120" y="72" fill="#8B5CF6">AI-Assisted Craft (Antigravity)</text>
        </g>
      </g>

      <!-- Bottom Row: Barcode & Authenticity Hologram -->
      <g transform="translate(25, 248)">
        <rect width="570" height="62" rx="6" fill="#0E141D" stroke="#18212B" stroke-width="1" />

        <!-- High-Density Cyber Barcode -->
        <g transform="translate(18, 12)" fill="#00E5FF" opacity="0.85">
          <rect x="0" y="0" width="3" height="30" />
          <rect x="5" y="0" width="1" height="30" />
          <rect x="8" y="0" width="4" height="30" />
          <rect x="14" y="0" width="2" height="30" />
          <rect x="19" y="0" width="1" height="30" />
          <rect x="23" y="0" width="5" height="30" />
          <rect x="31" y="0" width="2" height="30" />
          <rect x="36" y="0" width="1" height="30" />
          <rect x="39" y="0" width="3" height="30" />
          <rect x="44" y="0" width="4" height="30" />
          <rect x="50" y="0" width="2" height="30" />
          <rect x="55" y="0" width="1" height="30" />
          <rect x="59" y="0" width="5" height="30" />
          <rect x="67" y="0" width="2" height="30" />
          <rect x="71" y="0" width="3" height="30" />
          <rect x="76" y="0" width="1" height="30" />
          <rect x="80" y="0" width="4" height="30" />
          <rect x="86" y="0" width="2" height="30" />
          <rect x="91" y="0" width="1" height="30" />
          <rect x="94" y="0" width="5" height="30" />
          <rect x="102" y="0" width="2" height="30" />
          <rect x="106" y="0" width="3" height="30" />
          <rect x="111" y="0" width="1" height="30" />
          <rect x="115" y="0" width="4" height="30" />
          <rect x="122" y="0" width="2" height="30" />
          <rect x="126" y="0" width="1" height="30" />
          <rect x="130" y="0" width="5" height="30" />
          <rect x="138" y="0" width="3" height="30" />
          <rect x="144" y="0" width="1" height="30" />
          <rect x="148" y="0" width="4" height="30" />
          <rect x="155" y="0" width="2" height="30" />
          <rect x="160" y="0" width="1" height="30" />
          <rect x="163" y="0" width="5" height="30" />
          <rect x="171" y="0" width="2" height="30" />
          <rect x="175" y="0" width="4" height="30" />
          <rect x="182" y="0" width="1" height="30" />
          <rect x="185" y="0" width="3" height="30" />
          <rect x="190" y="0" width="2" height="30" />
          <rect x="195" y="0" width="4" height="30" />
          <rect x="202" y="0" width="1" height="30" />
          <rect x="205" y="0" width="3" height="30" />
        </g>
        <text x="18" y="52" class="dash-font-mono" font-size="8.5" fill="#9AA8B7">
          UUID: 4B811B85-6EBC-4CBC-A519-1EED1C910075
        </text>

        <!-- Right Side Verification Stamp -->
        <g transform="translate(390, 14)">
          <rect width="165" height="34" rx="4" fill="#141B24" stroke="#00FFC6" stroke-width="0.8" />
          <circle cx="16" cy="17" r="5" fill="#00FFC6" />
          <text x="28" y="16" class="dash-font-mono" font-size="9" font-weight="700" fill="#00FFC6">LAB VERIFIED 2026</text>
          <text x="28" y="27" class="dash-font-mono" font-size="8" fill="#9AA8B7">GITHUB: JUSTMAKEITUP</text>
        </g>
      </g>
    </g>
  </g>
</svg>
